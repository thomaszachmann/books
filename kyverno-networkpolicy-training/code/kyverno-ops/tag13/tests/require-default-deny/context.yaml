apiVersion: cli.kyverno.io/v1alpha1
kind: Context
metadata:
  name: netpols
spec:
  resources:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: default-deny, namespace: tenant-a}
    spec:
      podSelector: {}
      policyTypes: [Ingress, Egress]
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata: {name: allow-dns, namespace: tenant-b}
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
      - ports: [{port: 53, protocol: UDP}]
