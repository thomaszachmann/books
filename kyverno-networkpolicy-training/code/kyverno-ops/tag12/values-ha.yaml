# Tag 12: Kyverno produktionsnah - HA, PDB, Webhook-Ausschlüsse, Metriken
admissionController:
  replicas: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: admission-controller
backgroundController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
cleanupController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
reportsController:
  replicas: 2
  podDisruptionBudget:
    enabled: true
config:
  webhooks:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values: [kube-system, kube-node-lease, local-path-storage]
features:
  policyExceptions:
    enabled: true
    namespace: policy-exceptions
  backgroundScan:
    backgroundScanInterval: 2h
  registryClient:
    allowInsecure: true
grafana:
  enabled: true
prometheusRule:
  enabled: false
