# Tag 12: Cleanup-Controller darf Pods und PolicyExceptions löschen (Aggregation)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:cleanup-controller:guard-lab
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch, delete]
- apiGroups: [policies.kyverno.io]
  resources: [policyexceptions]
  verbs: [get, list, watch, delete]
