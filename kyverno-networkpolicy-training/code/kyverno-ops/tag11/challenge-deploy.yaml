apiVersion: apps/v1
kind: Deployment
metadata: {name: web-latest, namespace: shop}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:latest
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
