# kind im GitLab-Runner: API-Server über den Service-Namen "docker" erreichbar
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "0.0.0.0"
  apiServerPort: 6443
kubeadmConfigPatches:
- |
  kind: ClusterConfiguration
  apiServer:
    certSANs: [docker, localhost, 127.0.0.1]
