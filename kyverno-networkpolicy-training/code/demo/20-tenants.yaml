# tenant-a und tenant-b: je ein api (gleiche Konfiguration wie shop/api)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-nginx
  namespace: tenant-a
data:
  default.conf.template: |
    server {
      listen 8080;
      location / {
        default_type application/json;
        return 200 '{"svc":"api","ns":"${POD_NAMESPACE}","path":"$uri"}\n';
      }
      location /healthz {
        access_log off;
        return 200 'ok\n';
      }
    }
    server {
      listen 9113;
      location /metrics {
        default_type text/plain;
        return 200 'demo_requests_total{ns="${POD_NAMESPACE}"} 42\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tenant-a
  labels: {app: api, tier: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, tier: api}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.31-alpine
        env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        ports:
        - {name: http, containerPort: 8080}
        - {name: metrics, containerPort: 9113}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 5
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {memory: 64Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: conf, mountPath: /etc/nginx/templates}
      volumes:
      - name: conf
        configMap: {name: api-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tenant-a
  labels: {app: api, tier: api}
spec:
  selector: {app: api}
  ports:
  - {name: http, port: 80, targetPort: http}
  - {name: metrics, port: 9113, targetPort: metrics}
---
