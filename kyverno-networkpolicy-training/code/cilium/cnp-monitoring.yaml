# Tag 5, Drill 6: Admin-Tier - Monitoring darf überall Metriken holen (Accept)
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: monitoring-accept
spec:
  tier: Admin
  priority: 20
  subject:
    namespaces:
      matchLabels: {guard-lab: demo}
  ingress:
  - name: accept-scraper-metrics
    action: Accept
    from:
    - namespaces:
        matchLabels: {purpose: monitoring}
    protocols:
    - tcp:
        destinationPort:
          number: 9113
