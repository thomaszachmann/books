# Cilium 1.20 für kind (cilium-lab), Hubble mit Relay und UI
kubeProxyReplacement: true
k8sServiceHost: cilium-lab-control-plane   # API-Server direkt, kein kube-proxy
k8sServicePort: 6443
ipam:
  mode: kubernetes          # Pod-CIDR aus dem Node-Objekt (kind: 10.244.x.0/24)
operator:
  replicas: 1               # Lab: ein Operator reicht
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
