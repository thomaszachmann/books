# Tag 5, Challenge: Cloud-Metadaten per ClusterNetworkPolicy sperren (Admin-Tier)
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  tier: Admin
  priority: 5
  subject:
    namespaces:
      matchLabels: {guard-lab: demo}
  egress:
  - name: deny-metadata
    action: Deny
    to:
    - networks: ["169.254.169.254/32"]
