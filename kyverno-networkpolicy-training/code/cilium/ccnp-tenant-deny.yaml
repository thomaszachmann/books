# Tag 5, Drill 2: Mandanten-Trennung cluster-weit, kein Namespace-Admin hebelt sie aus
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: tenant-deny
specs:                         # mehrere Regeln in einem Objekt
- endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: tenant-a
  enableDefaultDeny:
    ingress: false             # nur verbieten, nicht alles andere schließen
  ingressDeny:
  - fromEndpoints:
    - matchExpressions:
      - {key: k8s:io.cilium.k8s.namespace.labels.tenant, operator: Exists}
      - {key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: [tenant-a]}
- endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: tenant-b
  enableDefaultDeny:
    ingress: false
  ingressDeny:
  - fromEndpoints:
    - matchExpressions:
      - {key: k8s:io.cilium.k8s.namespace.labels.tenant, operator: Exists}
      - {key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: [tenant-b]}
