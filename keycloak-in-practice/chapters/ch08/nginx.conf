# A proxy with a deliberately ordinary header limit.
#
# 4 x 4k is smaller than nginx's default of 4 x 8k, and it is chosen so
# that Chapter 8's inflated token fails here on a laptop the way a real
# one fails in front of a real gateway. Nothing about this is exotic:
# plenty of appliances ship with 8k and a few with 4k.

events {}

http {
  large_client_header_buffers 4 4k;

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass https://keycloak:8443;
      proxy_ssl_verify off;
      proxy_set_header Host sso.meridian.test;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
