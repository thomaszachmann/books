# The wiki from Chapter 1, unchanged, behind a proxy that authenticates
# for it. Chapter 17.
#
# WARNING, and it is the point of the lab: the proxy is the only thing
# performing authentication. Anything that can reach the wiki Service
# directly - any pod in this cluster, by default - reaches it with no
# authentication at all. The NetworkPolicy below is not optional
# decoration; without it this arrangement is worse than the password
# file it replaced.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiki-conf
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    Listen 80
    ServerName localhost
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule dir_module modules/mod_dir.so
    LoadModule log_config_module modules/mod_log_config.so
    User www-data
    Group www-data
    DocumentRoot "/usr/local/apache2/htdocs"
    ErrorLog /proc/self/fd/2
    LogFormat "%h %u %t \"%r\" %>s" common
    CustomLog /proc/self/fd/1 common
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki
spec:
  replicas: 1
  selector:
    matchLabels: { app: wiki }
  template:
    metadata:
      labels: { app: wiki }
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - name: conf
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
      volumes:
        - name: conf
          configMap: { name: wiki-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: wiki
spec:
  selector: { app: wiki }
  ports: [{ port: 80 }]
---
# Only the proxy may reach the wiki. This is half of the control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wiki-only-from-proxy
spec:
  podSelector:
    matchLabels: { app: wiki }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: oauth2-proxy }
