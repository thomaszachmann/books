# The one cluster of Part IV. Chapter 15 creates it; no later chapter
# deletes or replaces it.
#
# kind has no load balancer and no ingress controller. The control-plane
# node is labelled so ingress-nginx schedules on it, and port 8443 is
# mapped from your laptop to port 8443 on the node, where the ingress
# controller listens (k8s/ingress-nginx patches its hostPort to 8443).
# 8443 on the laptop and 8443 on the node: the same URL works from your
# browser and from anything inside the kind network. 443 on the laptop
# stays with the compose Keycloak.
#
# The API server is started with --authentication-config from the first
# day, pointing at a file in k8s/kind/authn/ that begins with no issuers
# at all. Chapter 16 writes the real configuration into that file, and
# the API server reloads it by itself - no restart, no new cluster, and
# the break-glass kubeconfig from Chapter 16 Step 0 stays valid.
#
# Create k8s/kind/authn/config.yaml BEFORE this file is used
# (./chapters/ch16/authn-config.sh does it). If the directory is
# missing, Docker creates it empty, the API server finds no file and
# `kind create cluster` fails waiting for the control plane.
#
# minikube users do not need this file; see k8s/minikube/README.md.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: meridian
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            authentication-config: /etc/kubernetes/authn/config.yaml
          extraVolumes:
            - name: authn
              hostPath: /etc/kubernetes/authn
              mountPath: /etc/kubernetes/authn
              readOnly: true
              pathType: Directory
    extraMounts:
      # Relative to the directory you run `kind create cluster` in: the
      # repository root. A directory, not a file: a file mount keeps
      # the old inode when an editor replaces the file, and the node
      # would never see Chapter 16's change.
      - hostPath: ./k8s/kind/authn
        containerPath: /etc/kubernetes/authn
    extraPortMappings:
      - containerPort: 8443
        hostPort: 8443
        protocol: TCP
