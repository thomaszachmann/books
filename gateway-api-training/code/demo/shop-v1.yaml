# Demo-Shop: Echo-Server, das Antwort-JSON enthält den Service-Namen
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-v1
  namespace: shop
  labels: {app: shop, version: v1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: shop, version: v1}
  template:
    metadata:
      labels: {app: shop, version: v1}
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.6.0
          env:
            - name: SERVICE_NAME
              value: shop-v1
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /health, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-v1
  namespace: shop
  labels: {app: shop, version: v1}
spec:
  selector: {app: shop, version: v1}
  ports:
    - {name: http, port: 80, targetPort: http}
