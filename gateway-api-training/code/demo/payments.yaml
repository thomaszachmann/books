# Demo-gRPC-Dienst: GrpcEcho mit Server Reflection auf Port 3000 (h2c)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: payments
  labels: {app: payments}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: grpc-echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.6.0
          env:
            - name: GRPC_ECHO_SERVER
              value: "1"
            - name: SERVICE_NAME
              value: payments
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: grpc, containerPort: 3000}
          readinessProbe:
            tcpSocket: {port: grpc}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: payments
  labels: {app: payments}
spec:
  selector: {app: payments}
  ports:
    - name: grpc
      port: 3000
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
