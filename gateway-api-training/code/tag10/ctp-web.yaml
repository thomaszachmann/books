# ClientTrafficPolicy: Verhalten zwischen Client und Envoy (Gateway web)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: web-clients
  namespace: infra
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: web
  timeout:
    http:
      requestReceivedTimeout: 10s    # ganze Anfrage inkl. Body
      idleTimeout: 60s               # Keep-Alive ohne Requests
  http2:
    maxConcurrentStreams: 100
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:                  # nur dieser Proxy darf XFF setzen
        - 10.10.20.1/32
