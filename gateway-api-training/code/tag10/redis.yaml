# Redis fuer globales Rate Limiting (Lab: ohne Persistenz, ohne Auth)
apiVersion: v1
kind: Namespace
metadata:
  name: redis-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: redis-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7.4-alpine
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: redis-system
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
