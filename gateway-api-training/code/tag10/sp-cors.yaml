# CORS fuer die Shop-Route: nur das Portal darf per Browser zugreifen
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: shop-cors
  namespace: shop
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: shop
  cors:
    allowOrigins:
      - https://portal.apps.lab.internal
    allowMethods: [GET, POST]
    allowHeaders: [Content-Type, Authorization]
    exposeHeaders: [X-Request-Id]
    maxAge: 10m
