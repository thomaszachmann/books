# BackendTrafficPolicy Stufe 2: global pro Client-IP + Resilienz
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: shop
  namespace: shop
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: shop
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct       # eigener Zaehler je Client-IP
                value: 0.0.0.0/0
          limit:
            requests: 30
            unit: Minute
  retry:
    numRetries: 2
    retryOn:
      triggers: [connect-failure, reset, retriable-status-codes]
      httpStatusCodes: [503]
    perRetry:
      timeout: 2s
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
  circuitBreaker:
    maxConnections: 64
    maxPendingRequests: 8
    maxParallelRequests: 32
  healthCheck:
    active:
      type: HTTP
      interval: 5s
      timeout: 1s
      unhealthyThreshold: 2
      healthyThreshold: 1
      http:
        path: /health
        expectedStatuses: [200]
    passive:
      consecutive5XxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
