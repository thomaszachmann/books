- name: Verzeichnis fuer Auto-Deploy-Manifeste anlegen
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    mode: "0755"

- name: Konfigdatei config.yaml schreiben
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  notify: Restart rke2-server

- name: Cilium-Werte (HelmChartConfig) ablegen
  ansible.builtin.template:
    src: rke2-cilium-config.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/rke2-cilium-config.yaml
    mode: "0600"

- name: DaemonSet kube-vip ablegen
  ansible.builtin.template:
    src: kube-vip.yaml.j2
    dest: /var/lib/rancher/rke2/server/manifests/kube-vip.yaml
    mode: "0600"

- name: Dienst rke2-server starten
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started

- name: Warten, bis der Node Ready ist
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl
    --kubeconfig /etc/rancher/rke2/rke2.yaml
    wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=30s
  register: rke2_server_node_ready
  retries: 20
  delay: 15
  until: rke2_server_node_ready.rc == 0
  changed_when: false

- name: Warten, bis die VIP den Supervisor-Port bedient
  ansible.builtin.wait_for:
    host: "{{ rke2_vip }}"
    port: 9345
    timeout: 300
  when: inventory_hostname == rke2_first_server
