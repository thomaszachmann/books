- name: Kernel-Module fuer Cilium/TPROXY laden
  community.general.modprobe:
    name: "{{ item }}"
    persistent: present
  loop: [xt_socket, iptable_raw, iptable_mangle]

- name: Sysctl fuer Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-rke2.conf
  loop: "{{ sysctls | dict2items }}"
  vars:
    sysctls:
      fs.inotify.max_user_instances: "1024"
      fs.inotify.max_user_watches: "1048576"

- name: Statische Hosts-Eintraege (Lab ohne DNS-Abhaengigkeit)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}.lab.internal {{ item }}"
  loop: "{{ groups['all'] }}"

- name: RKE2 installieren (Installer-Skript, Version gepinnt)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.rke2.io | sh -
  args:
    executable: /bin/bash
    creates: /usr/local/bin/rke2
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ 'server' if inventory_hostname
      in groups['rke2_servers'] else 'agent' }}"

- name: Konfig-Verzeichnis anlegen
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"
