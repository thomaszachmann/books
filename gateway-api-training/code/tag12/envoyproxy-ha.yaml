# EnvoyProxy web-proxy, Stand Tag 12: Tag 10/11 + HA (HPA, PDB, Spread, Drain)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: web-proxy
  namespace: infra
spec:
  shutdown:                              # neu: Graceful Drain
    drainTimeout: 45s                    # Grace Period = drainTimeout + 300 s
    minDrainDuration: 5s
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # replicas: 2 aus Tag 10 entfernt - ab jetzt zählt nur envoyHpa
        pod:
          topologySpreadConstraints:     # neu: max. 1 Pod Unterschied je Node
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: web
                  gateway.envoyproxy.io/owning-gateway-namespace: infra
        container:
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      envoyHpa:                          # neu: 2-6 Pods nach CPU
        minReplicas: 2
        maxReplicas: 6
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 60
      envoyPDB:                          # neu: Node-Drain lässt 1 Pod stehen
        minAvailable: 1
      envoyService:                      # unverändert aus Tag 9/10
        type: LoadBalancer
        externalTrafficPolicy: Cluster   # Pflicht mit Cilium L2
        annotations:
          lbipam.cilium.io/ips: 10.10.20.100
  telemetry:                             # aus Tag 11
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              host: "%REQ(:AUTHORITY)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              status: "%RESPONSE_CODE%"
              flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              upstream: "%UPSTREAM_HOST%"
              route: "%ROUTE_NAME%"
              request_id: "%REQ(X-REQUEST-ID)%"
              trace_id: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      samplingRate: 100                  # Lab: jeder Request, Produktion: 1-10
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: jaeger
            namespace: monitoring
            port: 4317
