# Messroute für Drain-Tests ohne Rate Limit (Tag 12)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ha
  namespace: shop
spec:
  parentRefs:
    - name: web
      namespace: infra
      sectionName: http
  hostnames:
    - ha.apps.lab.internal
  rules:
    - backendRefs:
        - name: shop-v1
          port: 80
