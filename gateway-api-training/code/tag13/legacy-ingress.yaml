# Lab: Altbestand eines ingress-nginx-Clusters (Tag 13), Host legacy.apps.lab.internal
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://portal.apps.lab.internal"
spec:
  ingressClassName: nginx
  rules:
  - host: legacy.apps.lab.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-v1
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-canary
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "20"
spec:
  ingressClassName: nginx
  rules:
  - host: legacy.apps.lab.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-v2
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-legacy-api
  namespace: shop
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/whitelist-source-range: "10.0.0.0/8,192.168.0.0/16"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Legacy: true";
spec:
  ingressClassName: nginx
  rules:
  - host: legacy.apps.lab.internal
    http:
      paths:
      - path: /api/v1(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: shop-v1
            port:
              number: 80
