# Beispiel: Ingress aus einem RKE2-Cluster mit eingebautem Traefik (Tag 13)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  namespace: shop
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: shop-strip-api@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: portal.apps.lab.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: shop-v1
            port:
              number: 80
