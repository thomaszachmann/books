# EnvoyProxy web-proxy, Stand Tag 11: Tag-10-Spec + Telemetrie
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: web-proxy
  namespace: infra
spec:
  provider:                              # unverändert aus Tag 9/10
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
      envoyService:
        type: LoadBalancer
        externalTrafficPolicy: Cluster   # Pflicht mit Cilium L2
        annotations:
          lbipam.cilium.io/ips: 10.10.20.100
  telemetry:                             # neu an Tag 11
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              host: "%REQ(:AUTHORITY)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              status: "%RESPONSE_CODE%"
              flags: "%RESPONSE_FLAGS%"
              duration_ms: "%DURATION%"
              upstream: "%UPSTREAM_HOST%"
              route: "%ROUTE_NAME%"
              request_id: "%REQ(X-REQUEST-ID)%"
              trace_id: "%TRACE_ID%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    tracing:
      samplingRate: 100                  # Lab: jeder Request, Produktion: 1-10
      provider:
        type: OpenTelemetry
        backendRefs:
          - name: jaeger
            namespace: monitoring
            port: 4317
