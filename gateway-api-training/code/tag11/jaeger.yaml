# Jaeger v2 all-in-one als OTLP-Empfänger (nur Lab, Speicher im RAM)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels: {app: jaeger}
  template:
    metadata:
      labels: {app: jaeger}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: ui, containerPort: 16686}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc,
       appProtocol: grpc}
    - {name: ui, port: 16686, targetPort: ui}
