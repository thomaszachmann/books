# Zweite Version des gRPC-Dienstes, um Methoden-Routing sichtbar zu machen
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-v2
  namespace: payments
  labels: {app: payments-v2}
spec:
  replicas: 1
  selector:
    matchLabels: {app: payments-v2}
  template:
    metadata:
      labels: {app: payments-v2}
    spec:
      containers:
        - name: grpc-echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.6.0
          env:
            - {name: GRPC_ECHO_SERVER, value: "1"}
            - {name: SERVICE_NAME, value: payments-v2}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          ports:
            - {name: grpc, containerPort: 3000}
          readinessProbe:
            tcpSocket: {port: grpc}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v2
  namespace: payments
spec:
  selector: {app: payments-v2}
  ports:
    - name: grpc
      port: 3000
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
