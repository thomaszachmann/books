# Shop-Routen auf RKE2: gleiche App, zwei Gateways
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: shop
spec:
  parentRefs:
    - name: web
      namespace: infra
  hostnames:
    - shop.apps.lab.internal
  rules:
    - backendRefs:
        - name: shop-v1
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-cilium
  namespace: shop
spec:
  parentRefs:
    - name: web-cilium
      namespace: infra
  hostnames:
    - shop.cilium.apps.lab.internal
  rules:
    - backendRefs:
        - name: shop-v2
          port: 80
