---
- name: RKE2 installieren
  ansible.builtin.include_tasks: install.yml

- name: Manifest-Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ rke2_server_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Cilium-HelmChartConfig und kube-vip ablegen
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ rke2_server_manifest_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - rke2-cilium-config.yaml
    - kube-vip.yaml

- name: Server-config.yaml schreiben
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/etc/rancher/rke2/config.yaml"
    mode: "0600"
  notify: Restart rke2-server

- name: Rke2-server starten
  ansible.builtin.systemd_service:
    name: rke2-server
    enabled: true
    state: started

- name: Warten bis der Node Ready ist
  ansible.builtin.command: >-
    {{ rke2_server_kubectl }} wait --for=condition=Ready
    node/{{ inventory_hostname }} --timeout=30s
  register: rke2_server_node_ready
  until: rke2_server_node_ready.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: API-Server über die VIP erreichbar
  ansible.builtin.wait_for:
    host: "{{ rke2_vip }}"
    port: 6443
    timeout: 300
