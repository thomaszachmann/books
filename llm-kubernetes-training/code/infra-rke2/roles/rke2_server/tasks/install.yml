---
- name: Installationsskript laden
  ansible.builtin.get_url:
    url: https://get.rke2.io
    dest: /root/rke2-install.sh
    mode: "0700"

- name: RKE2 installieren ({{ rke2_server_install_type }})
  ansible.builtin.command: /root/rke2-install.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ rke2_version }}"
    INSTALL_RKE2_TYPE: "{{ rke2_server_install_type }}"
  args:
    creates: /usr/local/bin/rke2

- name: Konfigurationsverzeichnis anlegen
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"
