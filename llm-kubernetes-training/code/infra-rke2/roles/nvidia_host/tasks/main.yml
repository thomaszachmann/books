---
- name: Werkzeug für Ubuntu-Treiberauswahl installieren
  ansible.builtin.apt:
    name: ubuntu-drivers-common
    update_cache: true

- name: Ist der Treiber schon geladen?
  ansible.builtin.command: nvidia-smi -L
  register: nvidia_host_smi
  changed_when: false
  failed_when: false

- name: Headless-Treiber (GPGPU) installieren
  ansible.builtin.command: >-
    ubuntu-drivers install --gpgpu nvidia:{{ nvidia_host_driver_branch }}
  when: nvidia_host_smi.rc != 0
  changed_when: true
  notify: Reboot GPU node

- name: Userspace-Tools (nvidia-smi, libnvidia-ml)
  ansible.builtin.apt:
    name: "nvidia-utils-{{ nvidia_host_driver_branch }}"
  notify: Reboot GPU node
