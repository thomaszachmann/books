# Prometheus scrapt /metrics aller vLLM-Services in ki-models (Tag 11)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  namespace: ki-models
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values: ["vllm-chat", "vllm-embed", "vllm-code"]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
