# GPU-Rauchtest (Tag 10): nvidia-smi auf rke2-gpu-1
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-test
---
apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
  namespace: gpu-test
spec:
  restartPolicy: Never
  nodeSelector:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: smi
      image: nvcr.io/nvidia/cuda:13.0.2-base-ubuntu24.04
      command: ["nvidia-smi"]
      resources:
        limits:
          nvidia.com/gpu: 1
