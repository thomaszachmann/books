# DRA (Tag 10, Drill 8): GPU per ResourceClaim statt nvidia.com/gpu
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: single-gpu
  namespace: gpu-test
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.nvidia.com
            selectors:
              - cel:
                  expression: >-
                    device.capacity['gpu.nvidia.com'].memory
                    .isGreaterThan(quantity('16Gi'))
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-smi
  namespace: gpu-test
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: smi
      image: nvcr.io/nvidia/cuda:13.0.2-base-ubuntu24.04
      command: ["nvidia-smi", "-L"]
      resources:
        claims:
          - name: gpu
  resourceClaims:
    - name: gpu
      resourceClaimTemplateName: single-gpu
