# Alternative zu litellm.yaml: offizielles Chart (oci://ghcr.io/berriai/litellm-helm)
# Nutzt dieselben Secrets (litellm-secrets, litellm-pg) und den Postgres aus Tag 4.
image:
  pullPolicy: IfNotPresent       # Default "Always" zieht bei jedem Start neu
masterkeySecretName: litellm-secrets
masterkeySecretKey: master-key
db:
  useExisting: true
  deployStandalone: false        # kein Bitnami-Postgres aus dem Chart
  endpoint: postgres
  database: litellm
  secret:
    name: litellm-pg
    usernameKey: username
    passwordKey: password
envVars:
  CHAT_API_BASE: http://llamacpp.ki-models:8080/v1
  LARGE_API_BASE: http://llamacpp.ki-models:8080/v1
  EMBED_API_BASE: http://llamacpp-embed.ki-models:8080/v1
resources:
  requests: {cpu: 250m, memory: 768Mi}
  limits: {memory: 1536Mi}
proxy_config:
  model_list:
    - model_name: chat-small
      litellm_params:
        model: openai/qwen2.5-0.5b
        api_base: os.environ/CHAT_API_BASE
        api_key: "none"
  general_settings:
    master_key: os.environ/PROXY_MASTER_KEY   # setzt das Chart aus dem Secret
