# LiteLLM produktiv auf RKE2 (Tag 12)
# Lokal: vLLM auf rke2-gpu-1 (Tag 11). Fallback: Mistral API (EU) per Env-Key.
model_list:
  - model_name: chat-large
    litellm_params:
      model: openai/qwen3-8b                 # --served-model-name in vLLM
      api_base: os.environ/VLLM_CHAT_API_BASE
      api_key: "none"                        # vLLM ohne --api-key
      timeout: 120
      rpm: 120                               # Router-Limit dieses Deployments
      input_cost_per_token: 0.0000002        # interne Verrechnung (Lab-Werte)
      output_cost_per_token: 0.0000006
    model_info:
      mode: chat
  - model_name: chat-small                   # Lab: dieselbe GPU, kürzere Antworten
    litellm_params:
      model: openai/qwen3-8b
      api_base: os.environ/VLLM_CHAT_API_BASE
      api_key: "none"
      max_tokens: 512
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000006
    model_info:
      mode: chat
  - model_name: chat-large-eu                # nur als Fallback gedacht
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      timeout: 60
    model_info:
      mode: chat

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 2                           # danach Cooldown
  cooldown_time: 30
  fallbacks:
    - chat-large: ["chat-large-eu"]
  # gemeinsamer Zustand aller Replikas (RPM/TPM, Cooldowns)
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  drop_params: true
  callbacks: ["prometheus"]
  require_auth_for_metrics_endpoint: false   # Prometheus scrapt ohne Key
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: 600
    supported_call_types: ["acompletion", "completion"]

guardrails:
  - guardrail_name: lab-filter
    litellm_params:
      guardrail: litellm_content_filter
      mode: pre_call
      default_on: true
      patterns:
        - pattern_type: prebuilt
          pattern_name: email
          action: MASK
      blocked_words:
        - keyword: "STRENG VERTRAULICH"
          action: BLOCK

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
  database_url: os.environ/DATABASE_URL
