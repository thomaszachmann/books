# Postgres für LiteLLM per CloudNativePG (Tag 12): 1 Primary + 1 Replica
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  namespace: ki-gateway
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: longhorn
  bootstrap:
    initdb:
      database: litellm
      owner: litellm         # Passwort erzeugt CNPG im Secret litellm-db-app
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
