# Alarme für die KI-Plattform (Tag 15) – kube-prometheus-stack lädt alle Rules
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ki-alerts
  namespace: monitoring
spec:
  groups:
    - name: ki-gpu
      rules:
        - alert: KIGPUFehlt
          expr: >-
            sum(kube_node_status_allocatable{resource="nvidia_com_gpu"}) < 1
            or absent(kube_node_status_allocatable{resource="nvidia_com_gpu"})
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Kein Node meldet nvidia.com/gpu (Treiber, Device Plugin?)
        - alert: KIGPUXid
          expr: max by (Hostname) (DCGM_FI_DEV_XID_ERRORS) > 0
          labels: {severity: critical}
          annotations:
            summary: Xid-Fehler {{ $value }} auf {{ $labels.Hostname }}
        - alert: KIGPUHeiss
          expr: max by (Hostname) (DCGM_FI_DEV_GPU_TEMP) > 85
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: GPU auf {{ $labels.Hostname }} über 85 °C
    - name: ki-vllm
      rules:
        - alert: KIvLLMWeg
          expr: absent(up{namespace="ki-models", job="vllm-chat"} == 1)
          for: 3m
          labels: {severity: critical}
          annotations:
            summary: vllm-chat liefert keine Metriken (Pod weg oder CrashLoop)
        - alert: KIvLLMWarteschlange
          expr: sum by (model_name) (vllm:num_requests_waiting) > 5
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.model_name }}: {{ $value }} Requests warten"
        - alert: KIvLLMTTFT
          expr: >-
            histogram_quantile(0.95, sum by (le, model_name)
            (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 2
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.model_name }}: TTFT p95 über 2 s"
    - name: ki-gateway
      rules:
        - alert: KIFallbackExtern
          expr: >-
            sum by (fallback_model)
            (increase(litellm_deployment_successful_fallbacks_total[10m])) > 0
          labels: {severity: warning}
          annotations:
            summary: Prompts gehen an {{ $labels.fallback_model }} (extern)
        - alert: KIDeploymentAusfall
          expr: max by (litellm_model_name) (litellm_deployment_state) == 2
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: LiteLLM-Backend {{ $labels.litellm_model_name }} ausgefallen
        - alert: KITeamBudget
          expr: >-
            max by (team_alias) (litellm_remaining_team_budget_metric)
            / max by (team_alias) (litellm_team_max_budget_metric) < 0.1
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Team {{ $labels.team_alias }} hat unter 10 % Budget
    - name: ki-plattform
      rules:
        - alert: KILonghornDegraded
          expr: max by (volume) (longhorn_volume_robustness) == 2
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Longhorn-Volume {{ $labels.volume }} degraded
        - alert: KIZertifikatLaeuftAb
          expr: >-
            min by (namespace, name)
            (certmanager_certificate_expiration_timestamp_seconds - time())
            < 7 * 86400
          labels: {severity: warning}
          annotations:
            summary: Zertifikat {{ $labels.namespace }}/{{ $labels.name }} < 7 Tage
        - alert: KIBackupAlt
          expr: >-
            time() - max(
            velero_backup_last_successful_timestamp{schedule="ki-taeglich"}
            ) > 26 * 3600
          labels: {severity: critical}
          annotations:
            summary: Letztes erfolgreiches Velero-Backup älter als 26 h
