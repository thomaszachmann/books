# Qdrant im Namespace ki-chat – Lab: 1 Replika, Longhorn-Volume
replicaCount: 1
image:
  tag: v1.19.2
apiKey:
  valueFrom:
    secretKeyRef:
      name: qdrant-auth
      key: api-key
persistence:
  storageClassName: longhorn
  size: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
