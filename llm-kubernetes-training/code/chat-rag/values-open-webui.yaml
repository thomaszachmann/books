# Open WebUI für das Team auf RKE2 – chat.lab.internal
replicaCount: 2
ollama:
  enabled: false
pipelines:
  enabled: false

# Modelle ausschließlich über LiteLLM (Virtual Key aus Secret)
openaiBaseApiUrl: http://litellm.ki-gateway:4000/v1
openaiApiKeyExistingSecret: owui-secrets
openaiApiKeyExistingSecretKey: litellm-key

# Mehrere Replikas: Redis für Websockets, RWX-Volume für Uploads
websocket:
  enabled: true
  manager: redis
  redis:
    enabled: true
persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn
  accessModes:
    - ReadWriteMany

ingress:
  enabled: true
  class: traefik
  host: chat.lab.internal
  tls: true
  existingSecret: chat-lab-internal-tls
  annotations:
    cert-manager.io/cluster-issuer: lab-ca

sso:
  enabled: true
  enableSignup: true
  oidc:
    enabled: true
    providerName: Keycloak
    providerUrl: https://sso.lab.internal/realms/ki-lab/.well-known/openid-configuration
    clientId: open-webui
    clientExistingSecret: owui-secrets
    clientExistingSecretKey: oidc-client-secret
    scopes: openid email profile

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 3Gi

extraEnvVars:
  - name: WEBUI_URL
    value: https://chat.lab.internal
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: owui-secrets
        key: webui-secret-key
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: owui-db-app
        key: uri
  - name: ENABLE_PERSISTENT_CONFIG
    value: "False"
  # Login nur per Keycloak, Rollen aus der Gruppen-Claim
  - name: ENABLE_LOGIN_FORM
    value: "False"
  - name: OPENID_REDIRECT_URI
    value: https://chat.lab.internal/oauth/oidc/callback
  - name: SSL_CERT_FILE
    value: /etc/lab-ca/ca.crt
  - name: REQUESTS_CA_BUNDLE
    value: /etc/lab-ca/ca.crt
  - name: ENABLE_OAUTH_ROLE_MANAGEMENT
    value: "True"
  - name: OAUTH_ROLES_CLAIM
    value: groups
  - name: OAUTH_ALLOWED_ROLES
    value: ki-users,ki-admins
  - name: OAUTH_ADMIN_ROLES
    value: ki-admins
  - name: ENABLE_OAUTH_GROUP_MANAGEMENT
    value: "True"
  - name: ENABLE_OAUTH_GROUP_CREATION
    value: "True"
  - name: OAUTH_GROUP_CLAIM
    value: groups
  # RAG: Qdrant + Embeddings über LiteLLM-Alias "embed"
  - name: VECTOR_DB
    value: qdrant
  - name: QDRANT_URI
    value: http://qdrant.ki-chat:6333
  - name: QDRANT_API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-auth
        key: api-key
  - name: RAG_EMBEDDING_ENGINE
    value: openai
  - name: RAG_OPENAI_API_BASE_URL
    value: http://litellm.ki-gateway:4000/v1
  - name: RAG_OPENAI_API_KEY
    valueFrom:
      secretKeyRef:
        name: owui-secrets
        key: litellm-key
  - name: RAG_EMBEDDING_MODEL
    value: embed
  - name: RAG_EMBEDDING_BATCH_SIZE
    value: "16"
  - name: CHUNK_SIZE
    value: "1000"
  - name: CHUNK_OVERLAP
    value: "150"
  - name: RAG_TOP_K
    value: "5"
  - name: RAG_FILE_MAX_SIZE
    value: "25"
  - name: ENABLE_RAG_HYBRID_SEARCH
    value: "False"

volumes:
  - name: lab-ca
    configMap:
      name: lab-ca
volumeMounts:
  container:
    - name: lab-ca
      mountPath: /etc/lab-ca
      readOnly: true
