# kind-Cluster "ki-lab": 1 control-plane (Ingress) + 1 worker (Modelle)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ki-lab
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
  - role: worker
    labels:
      ki-lab/role: models
