variables:
  DT_URL: "http://dtrack-apiserver.example.internal:8080"
  # DT_API_KEY: als maskierte, geschützte CI/CD-Variable oder aus Vault

sbom:
  stage: test
  image: reg-build:5000/tools/sbom:1.0.0
  needs: ["build"]
  script:
    - syft "registry:${IMAGE_REF}" -o cyclonedx-json=sbom.cdx.json
        -o spdx-json=sbom.spdx.json
    - >
      curl -sS --fail-with-body -X POST "${DT_URL}/api/v1/bom"
      -H "X-Api-Key: ${DT_API_KEY}"
      -F "autoCreate=true"
      -F "projectName=${CI_PROJECT_NAME}"
      -F "projectVersion=${CI_COMMIT_REF_NAME}"
      -F "bom=@sbom.cdx.json"
      | tee dt-upload.json
  artifacts:
    paths: [sbom.cdx.json, sbom.spdx.json, dt-upload.json]
    expire_in: 90 days
