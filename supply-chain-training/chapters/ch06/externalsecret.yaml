apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-app-db
  namespace: demo
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: demo-app-db
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: demo-app/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: demo-app/db
        property: password
