stages:
  - test
  - build

variables:
  # Cluster-/Netz-Adresse der Build-Registry (Docker-Netz "kind")
  IMAGE_NAME: "reg-build:5000/demo-app"

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
    - python -m pytest -q

build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      --digest-file "$CI_PROJECT_DIR/image-digest.txt"
      --insecure
    - echo "Gebaut: $IMAGE_NAME@$(cat image-digest.txt)"
  artifacts:
    paths:
      - image-digest.txt
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
