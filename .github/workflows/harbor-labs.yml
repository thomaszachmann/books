name: harbor labs

# Runs the Harbor labs weekly against the pinned versions and against
# whatever is current. A failure against 'latest' is information, not a
# regression: the book is written against the pin, so that job is allowed
# to fail and an issue is opened instead.
#
# Known gap: Multipass needs nested virtualisation, which GitHub runners
# do not have. The VM path is exercised by running the Harbor installer
# directly on the runner. The VM itself is not tested here.

on:
  push:
    branches: [harbor-in-practice, main]
    paths: ['harbor-in-practice/**', '.github/workflows/harbor-labs.yml']
  pull_request:
    paths: ['harbor-in-practice/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: harbor-in-practice

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        # The runner image ships shellcheck. Installing it again cost
        # six minutes on one run when an apt mirror was slow, for a tool
        # that was already there.
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version | head -2
          shellcheck -S warning scripts/*.sh chapters/*/*.sh
      - name: versions file parses
        run: |
          eval "$(grep -E '^[A-Z_]+=' VERSIONS.md)"
          test -n "$HARBOR_VERSION"
          test -n "$HARBOR_CHART_VERSION"
          echo "pinned: $HARBOR_VERSION / $HARBOR_CHART_VERSION"
      - name: versions.sh can be sourced from bash AND zsh
        # The README tells readers to source it, and zsh is the default
        # shell on macOS. zsh has no BASH_SOURCE; the unguarded form
        # failed with "parameter not set", which under set -u in the
        # caller takes the session with it.
        run: |
          # bash first: this must always pass, and a package mirror
          # cannot excuse it.
          bash -c 'set -u; . ./scripts/versions.sh; test -n "$HARBOR_VERSION"'
          echo "bash: ok"

          # zsh is not preinstalled. Give apt two minutes; a slow mirror
          # should not block every run, but it must not silently turn
          # the test off either - so the fallback asserts the guard
          # statically and says which check actually ran.
          if ! command -v zsh >/dev/null; then
            timeout 120 sudo apt-get update -qq && \
              timeout 120 sudo apt-get install -y zsh || true
          fi

          if command -v zsh >/dev/null; then
            zsh -c 'set -u; . ./scripts/versions.sh; test -n "$HARBOR_VERSION"'
            echo "zsh: ok, sourced for real"
          else
            echo "zsh unavailable - falling back to a static check"
            grep -q 'ZSH_VERSION' scripts/versions.sh \
              || { echo "versions.sh has no zsh branch"; exit 1; }
            grep -q 'BASH_SOURCE\[0\]:-' scripts/versions.sh \
              || { echo "BASH_SOURCE is unguarded"; exit 1; }
            echo "zsh: guard present, not executed"
          fi

  ch01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: plain registry, push, read digest
        run: ./chapters/ch01/plain-registry.sh
      - name: moving a tag changes the digest
        run: ./chapters/ch01/move-tag.sh
      - name: the sizes the book prints are the sizes it gets
        # Both digests carry "size: 527" in the manuscript. Two images
        # with byte-identical manifests looks like a copy-paste error and
        # is not: both are single-layer, and a schema2 manifest's length
        # depends on the layer count, not on the content. Asserted so
        # that a change in either image turns this red.
        run: |
          docker rm -f plain-registry >/dev/null 2>&1 || true
          docker run -d --rm --name plain-registry -p 5000:5000 \
            -e REGISTRY_STORAGE_DELETE_ENABLED=true registry:2
          until curl -sf http://localhost:5000/v2/ >/dev/null; do sleep 1; done
          for img in alpine:3.20 busybox:1.36; do
            docker pull -q "$img" >/dev/null
            docker tag "$img" localhost:5000/meridian/tracking:2.4.1
            out=$(docker push localhost:5000/meridian/tracking:2.4.1 | tail -1)
            echo "$img -> $out"
            case "$out" in *"size: 527") ;; *)
              echo "the manuscript prints size: 527 for $img"; exit 1 ;;
            esac
          done
      - name: step 8 - an unauthenticated delete is accepted
        # The book prints 202 and then reasons from it. Assert it.
        run: |
          OCI='application/vnd.oci.image.manifest.v1+json'
          V2='application/vnd.docker.distribution.manifest.v2+json'
          D=$(curl -sI -H "Accept: $OCI" -H "Accept: $V2" \
                http://localhost:5000/v2/meridian/tracking/manifests/2.4.1 \
              | tr -d '\r' \
              | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}')
          code=$(curl -s -X DELETE \
            "http://localhost:5000/v2/meridian/tracking/manifests/$D" \
            -o /dev/null -w '%{http_code}')
          test "$code" = 202 || { echo "delete returned $code, book says 202"; exit 1; }
          tags=$(curl -s http://localhost:5000/v2/meridian/tracking/tags/list)
          echo "$tags"
          case "$tags" in *'"tags":null'*) ;; *)
            echo 'solution 1.3 says the answer is "tags":null'; exit 1 ;;
          esac

  ch02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: a root CA and a server certificate
        run: ./chapters/ch02/make-certs.sh 192.0.2.10
      - name: the SAN is present, and the chain verifies
        run: |
          openssl x509 -noout -text -in certs/harbor.crt \
            | grep -A1 'Subject Alternative Name' \
            | grep -q 'DNS:harbor.meridian.test'
          openssl verify -CAfile certs/ca.crt certs/harbor.crt
      - name: a certificate without a SAN is rejected by Go
        run: |
          # Chapter 2, exercise 2.3, as a test. Sign without -extfile
          # and prove the result is refused - so that the chapter's
          # claim is checked rather than asserted.
          cd certs
          openssl req -new -sha256 -key harbor.key -out bad.csr \
            -subj "/O=Meridian Freight/CN=harbor.meridian.test"
          openssl x509 -req -sha256 -days 1 -in bad.csr \
            -CA ca.crt -CAkey ca.key -CAcreateserial -out bad.crt
          if openssl x509 -noout -text -in bad.crt \
             | grep -q 'Subject Alternative Name'; then
            echo "expected no SAN on the deliberately bad cert"; exit 1
          fi
          echo "no SAN, as expected - this is what 2.3 asks you to see"

  ch03:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3
      - name: verify the installer against its sigstore bundle
        # The online installer is under a megabyte, so the whole
        # verification runs here for real. The offline one is 696 MB and
        # is verified by the same script with the same flags.
        run: |
          mkdir -p /tmp/hv
          WORK_DIR=/tmp/hv ./chapters/ch03/verify-installer.sh online
      - name: a bundle does not verify a different file
        # Chapter 3, exercise 3.3. The check has to fail when it should.
        run: |
          cd /tmp/hv
          echo "not the installer" > impostor.tgz
          if cosign verify-blob \
               --bundle harbor-online-installer-*.tgz.sigstore.json \
               --certificate-identity-regexp \
                 'https://github.com/goharbor/harbor/.github/workflows/.*' \
               --certificate-oidc-issuer \
                 'https://token.actions.githubusercontent.com' \
               impostor.tgz 2>/dev/null; then
            echo "verification passed on the wrong file"; exit 1
          fi
          echo "refused, as it must"
      - name: harbor.yml renders and parses
        run: |
          # envsubst ships with the runner image; installing it again
          # cost minutes on a slow mirror, for a tool already present.
          command -v envsubst >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y gettext-base; }
          HARBOR_HOSTNAME=harbor.meridian.test \
            ./chapters/ch03/render-harbor-yml.sh /tmp/harbor.yml
          python3 -c "import yaml,sys; d=yaml.safe_load(open('/tmp/harbor.yml')); \
            assert d['hostname']=='harbor.meridian.test'; \
            print('parsed, _version', d['_version'])"
          test "$(stat -c '%a' /tmp/harbor.yml)" = 600

  ch04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the decoder round-trips every padding residue
        # An earlier version of this job asserted that raw 'base64 -d'
        # fails on unpadded input. It does not - GNU coreutils decodes
        # it correctly, and only BSD base64 on macOS truncates. The
        # chapter was wrong and this job caught it. What is asserted
        # here instead is the property that actually has to hold: the
        # decoder returns the payload unchanged, whatever the residue.
        run: |
          for pad in 0 1 2; do
            JSON=$(printf '{"access":[{"type":"repository","name":"platform/base","actions":["pull"]}],"iat":1,"exp":1801,"p":"%s"}' \
                   "$(printf '%*s' "$pad" '' | tr ' ' 'x')")
            PAY=$(printf '%s' "$JSON" | base64 -w0 | tr '+/' '-_' | tr -d '=')
            OUT=$(./chapters/ch04/jwt-decode.sh "eyJhIjoxfQ.$PAY.c2ln")
            test "$OUT" = "$JSON" || {
              echo "residue $(( ${#PAY} % 4 )): round-trip failed"
              echo "  in : $JSON"; echo "  out: $OUT"; exit 1; }
            echo "residue $(( ${#PAY} % 4 )): ok"
          done
      - name: the scope really is readable out of the token
        run: |
          JSON='{"access":[{"type":"repository","name":"platform/base","actions":["pull"]}],"iat":1,"exp":1801}'
          PAY=$(printf '%s' "$JSON" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          OUT=$(./chapters/ch04/jwt-decode.sh "eyJhIjoxfQ.$PAY.c2ln")
          echo "$OUT" | jq -e '.access[0].name == "platform/base"'
          echo "$OUT" | jq -e '.access[0].actions == ["pull"]'
          echo "$OUT" | jq -e '.exp - .iat == 1800'

  ch05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the role table matches the pinned source
        # Transcribed tables rot. This asserts the values the chapter
        # prints, so that a Harbor release which changes them turns the
        # latest column red rather than leaving the book wrong.
        run: |
          . ./chapters/ch05/roles.sh
          fail=0
          chk() { if "$1" "$2"; then r=yes; else r=no; fi
                  [ "$r" = "$3" ] || { echo "$1 $2: $r, expected $3"; fail=1; }; }
          # push: projectAdmin, developer, maintainer
          for r in 1 2 4; do chk may_push $r yes; done
          for r in 3 5;   do chk may_push $r no;  done
          # delete: projectAdmin and maintainer only
          for r in 1 4;     do chk may_delete $r yes; done
          for r in 2 3 5;   do chk may_delete $r no;  done
          # starting a scan is not a developer right
          chk may_start_scan 2 no
          chk may_read_scan  2 yes
          # only projectAdmin edits members, makes robots, reads logs
          for f in may_edit_members may_make_robots may_read_logs; do
            chk $f 1 yes; for r in 2 3 4 5; do chk $f $r no; done
          done
          # limitedGuest is the only role that cannot see members
          for r in 1 2 3 4; do chk may_see_members $r yes; done
          chk may_see_members 5 no
          exit $fail
      - name: role_id is not a ranking
        # The bug the chapter asks the reader to build on purpose.
        run: |
          . ./chapters/ch05/roles.sh
          if [ 4 -le 2 ]; then echo unreachable; fi
          may_push 4 || { echo "maintainer must be able to push"; exit 1; }
          echo "role 4 outranks role 2 and has the higher number"

  ch06:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: expiry check treats -1 as never, not as overdue
        # Harbor writes -1 for "never expires". It is smaller than any
        # threshold, so a check without select(.expires_at > 0) reports
        # every permanent robot as due, fires constantly, gets switched
        # off, and takes the real alert with it.
        run: |
          NOW=$(date +%s)
          FIX=$(jq -n --argjson now "$NOW" '[
            {name:"robot$platform+ci-push", expires_at: ($now + 29*86400)},
            {name:"robot$platform+soon",    expires_at: ($now +  3*86400)},
            {name:"robot$system+scanner",   expires_at: -1},
            {name:"robot$platform+old",     expires_at: ($now + 200*86400)}
          ]')

          # 14 days: the 3-day robot is due, so this must fail
          if ROBOTS_JSON="$FIX" ./chapters/ch06/expiring-robots.sh 14; then
            echo "expected a non-zero exit for the 3-day robot"; exit 1
          fi

          # 1 day: nothing is due, and -1 must not count
          ROBOTS_JSON="$FIX" ./chapters/ch06/expiring-robots.sh 1 \
            || { echo "-1 was counted as overdue"; exit 1; }

          # and prove the trap is real without the filter
          bad=$(printf '%s' "$FIX" | jq --argjson now "$NOW" \
            '[ .[] | select(.expires_at - $now < 86400) ] | length')
          test "$bad" -eq 1 || { echo "the trap did not reproduce"; exit 1; }
          echo "without the filter, 1 permanent robot reports as overdue"

  ch07:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: every configuration key used is one Harbor defines
        # A misspelled key can come back 200 with the setting never
        # applied, so nothing at runtime tells you. Check it here.
        run: |
          grep -oE '^    [a-z_]+:' chapters/ch07/set-oidc.sh \
            | tr -d ' :' | sort -u > /tmp/used.txt
          grep -vE '^\s*#' chapters/ch07/config-keys.txt \
            | grep -E '^[a-z_]+$' | sort -u > /tmp/valid.txt
          echo "keys used:"; sed 's/^/  /' /tmp/used.txt
          if ! comm -23 /tmp/used.txt /tmp/valid.txt | grep -q .; then
            echo "all defined by Harbor"
          else
            echo "NOT defined by Harbor:"
            comm -23 /tmp/used.txt /tmp/valid.txt | sed 's/^/  /'
            exit 1
          fi
      - name: the dex config parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('chapters/ch07/dex/config.yaml'))"
      - name: check-auth-mode reports frozen when users exist
        run: |
          USERS_JSON='[]' HARBOR_PASS=x ./chapters/ch07/check-auth-mode.sh \
            2>/dev/null | grep -q 'CAN still be changed' \
            || echo "note: needs a live Harbor for the auth_mode read"
          USERS_JSON='[{"username":"ana"},{"username":"bruno"}]' \
            HARBOR_PASS=x ./chapters/ch07/check-auth-mode.sh 2>/dev/null \
            | grep -q 'CANNOT be changed' && echo "frozen case detected"

  ch08:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the index the book describes still looks like that
        # Chapter 8 prints "children: 16" and "8 platforms" for
        # alpine:3.20, and names three child digests. Upstream can
        # rebuild that tag. If it does, the book is wrong and this
        # should say so rather than the reader discovering it.
        run: |
          TOK=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/alpine:pull" | jq -r .token)
          IDX=$(curl -s -H "Authorization: Bearer $TOK" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            https://registry-1.docker.io/v2/library/alpine/manifests/3.20)
          FIX=$(printf '%s' "$IDX" | jq '{
            manifest_media_type: .mediaType,
            references: [ .manifests[]
              | {child_digest: .digest, platform: .platform} ] }')
          OUT=$(INDEX_JSON="$FIX" ./chapters/ch08/index-children.sh)
          echo "$OUT"
          echo "$OUT" | grep -q 'children             16' \
            || { echo "the book prints 16 children"; exit 1; }
          echo "$OUT" | grep -q 'of those, platforms  8' \
            || { echo "the book prints 8 platforms"; exit 1; }
          printf '%s' "$IDX" | jq -e '.mediaType ==
            "application/vnd.oci.image.index.v1+json"'
          printf '%s' "$IDX" | jq -e '[.manifests[]
            | select(.platform.architecture=="amd64" and .platform.os=="linux")
            | .digest] == ["sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e"]' \
            || { echo "the amd64 digest printed in step 2 has changed"; exit 1; }
      - name: untagged.sh separates index children from orphans
        run: |
          ART=$(jq -n '[
            {repository_name:"platform/multi",
             digest:"sha256:aaaa111122223333", tags:[{name:"1.0"}],
             references:[{child_digest:"sha256:bbbb111122223333"}]},
            {repository_name:"platform/multi",
             digest:"sha256:bbbb111122223333", tags:null, references:null},
            {repository_name:"platform/old",
             digest:"sha256:dddd111122223333", tags:null, references:null}
          ]')
          OUT=$(ARTIFACTS_JSON="$ART" ./chapters/ch08/untagged.sh)
          echo "$OUT"
          echo "$OUT" | grep -q 'child .*bbbb1111' || exit 1
          echo "$OUT" | grep -q 'ORPHAN .*dddd1111' || exit 1
          echo "$OUT" | grep -q 'ORPHAN .*bbbb1111' \
            && { echo "an index child was reported as an orphan"; exit 1; }
          echo "separated correctly"

  ch09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the threshold is inclusive, as the chapter's table says
        # vulnerable.go compares Severity.Code() >= projectSeverity.Code().
        # The book prints a table of that. Assert every cell of it.
        run: |
          . ./chapters/ch09/severity.sh
          fail=0
          chk() { if would_block "$1" "$2"; then r=block; else r=-; fi
                  [ "$r" = "$3" ] || { echo "$1 vs $2: $r, want $3"; fail=1; }; }
          chk high     high     block     # inclusive, the whole point
          chk critical high     block
          chk medium   high     -
          chk low      high     -
          chk low      low      block
          chk critical critical block
          chk high     critical -
          for f in low medium high critical; do chk $f none -; done
          exit $fail
      - name: unscanned.sh counts no-report and not-Success alike
        run: |
          FIX=$(jq -n '[
            {repository_name:"platform/ok",   digest:"sha256:1111222233334444",
             scan_overview:{"s":{scan_status:"Success"}}},
            {repository_name:"platform/none", digest:"sha256:5555666677778888",
             scan_overview:null},
            {repository_name:"platform/busy", digest:"sha256:9999aaaabbbbcccc",
             scan_overview:{"s":{scan_status:"Running"}}}
          ]')
          if OUT=$(ARTIFACTS_JSON="$FIX" ./chapters/ch09/unscanned.sh); then
            echo "expected a non-zero exit"; exit 1
          fi
          echo "$OUT"
          echo "$OUT" | grep -q '2 artifact(s) would be refused' || exit 1
          echo "$OUT" | grep -q 'platform/ok' && \
            { echo "a successfully scanned artifact was listed"; exit 1; }
          echo "counted correctly"

  ch10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: sigstore/cosign-installer@v3
      - name: a signature satisfies the check, and only one key verifies
        # Chapter 10 step 4 claims that any key produces a signature
        # Harbor's policy accepts, and step 5 that cosign verify tells
        # the two apart. Both run here for real against a plain
        # registry - no Harbor needed, because the claim is about
        # cosign and about what a signature is.
        run: |
          docker run -d --rm --name sigreg -p 5000:5000 registry:2
          until curl -sf http://localhost:5000/v2/ >/dev/null; do sleep 1; done
          docker pull -q alpine:3.20
          REF=localhost:5000/platform/signed:1.0
          docker tag alpine:3.20 "$REF"
          docker push "$REF"

          export COSIGN_PASSWORD=lab
          mkdir -p /tmp/real /tmp/impostor
          (cd /tmp/real     && cosign generate-key-pair)
          (cd /tmp/impostor && cosign generate-key-pair)

          cosign sign --yes --allow-insecure-registry --allow-http-registry \
            --key /tmp/real/cosign.key "$REF"

          echo "== the real key verifies"
          cosign verify --allow-insecure-registry --allow-http-registry \
            --key /tmp/real/cosign.pub "$REF" >/dev/null \
            || { echo "the signing key should verify"; exit 1; }

          echo "== an unrelated key does not"
          if cosign verify --allow-insecure-registry --allow-http-registry \
               --key /tmp/impostor/cosign.pub "$REF" >/dev/null 2>&1; then
            echo "an unrelated key verified - the chapter is wrong"; exit 1
          fi
          echo "refused, as step 5 says"

          echo "== but the impostor can still produce a signature"
          REF2=localhost:5000/platform/single:1.0
          docker tag alpine:3.20 "$REF2" && docker push "$REF2"
          cosign sign --yes --allow-insecure-registry --allow-http-registry \
            --key /tmp/impostor/cosign.key "$REF2"
          cosign verify --allow-insecure-registry --allow-http-registry \
            --key /tmp/impostor/cosign.pub "$REF2" >/dev/null \
            || { echo "the impostor's own key should verify"; exit 1; }
          echo "a made-up key produces a valid signature - step 4"

  ch11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: retention preview reports what is NOT retained
        # The arithmetic that matters: a policy deletes total - retained,
        # because every rule template only ever retains.
        run: |
          T=$(jq -n '[{repository:"platform/app",total:9,retained:2},
                      {repository:"platform/base",total:4,retained:4}]')
          OUT=$(TASKS_JSON="$T" ./chapters/ch11/retention-preview.sh)
          echo "$OUT"
          echo "$OUT" | grep -qE 'platform/app +9 +2 +7' || {
            echo "expected 7 to be removed from platform/app"; exit 1; }
          echo "$OUT" | grep -q '7 of 13 artifact(s) are not retained' || {
            echo "expected a 7 of 13 total"; exit 1; }
          echo "$OUT" | grep -q 'UPPER BOUND' || {
            echo "the immutability caveat must be printed"; exit 1; }
      - name: gc-status separates refusals from deletions
        run: |
          LOG=$'delete blob sha256:aa\ndelete blob sha256:bb\nfailed to delete untagged:1 artifact in DB\nthe deleting artifact is referenced by others\nthe deleting artifact is referenced by others'
          OUT=$(GC_LOG="$LOG" ./chapters/ch11/gc-status.sh)
          echo "$OUT"
          echo "$OUT" | grep -qE 'blobs deleted +2' || exit 1
          echo "$OUT" | grep -qE 'artifacts refused +2' || exit 1
          echo "$OUT" | grep -q 'The refusals are correct' || exit 1

  ch12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: unlimited is -1, and -1 beats every threshold
        # Same trap as robot expiry in Chapter 6: unlimited is negative,
        # so a naive percentage comparison reports every unlimited
        # project as over quota, the alert fires always and gets
        # switched off.
        run: |
          FIX=$(jq -n '[
            {ref:{name:"platform"}, used:{storage:41203847},
             hard:{storage:45000000}},
            {ref:{name:"meridian"}, used:{storage:3623807},
             hard:{storage:-1}},
            {ref:{name:"quiet"},    used:{storage:1000},
             hard:{storage:100000}}]')
          if OUT=$(QUOTAS_JSON="$FIX" ./chapters/ch12/quota-report.sh 80); then
            echo "platform is at 91%, expected a non-zero exit"; exit 1
          fi
          echo "$OUT"
          echo "$OUT" | grep -q '1 project(s) above 80%' || {
            echo "expected exactly one project over threshold"; exit 1; }
          echo "$OUT" | grep -qE 'meridian .*unlimited .* -' || {
            echo "unlimited must print as unlimited, not as a percentage"
            exit 1; }
          # and below the threshold nothing is reported
          QUOTAS_JSON="$FIX" ./chapters/ch12/quota-report.sh 95 >/dev/null || {
            echo "at 95% nothing should be over"; exit 1; }
          echo "unlimited handled, threshold respected"

  ch13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: replication-gap refuses without both projects
        run: |
          if ./chapters/ch13/replication-gap.sh 2>/dev/null; then
            echo "expected a refusal without arguments"; exit 1
          fi
          echo "refused, as it must"
      - name: the chapter's filter claim, stated where it is checkable
        # A cosign signature's tag is derived from the digest it signs,
        # so a release-shaped tag filter cannot match it. Assert the
        # shape rather than the prose.
        run: |
          DIGEST=sha256:6c2a9711b0a9f32b0239d9222eb1072309cf46c6431d319ae249186d811a987c
          SIGTAG="$(printf '%s' "$DIGEST" | tr ':' '-').sig"
          echo "signature tag: $SIGTAG"
          case "$SIGTAG" in
            release-*) echo "a release filter would match it"; exit 1 ;;
            sha256-*.sig) echo "no release-* filter matches this" ;;
            *) echo "unexpected shape"; exit 1 ;;
          esac

  ch14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: an unhealthy upstream is reported, a healthy one is not
        # The chapter's central claim: a proxy cache refuses rather than
        # degrading. cache-health.sh exists to surface that state, so it
        # has to detect it.
        run: |
          P=$(jq -n '[{name:"dockerhub",registry_id:1},
                      {name:"platform",registry_id:0},
                      {name:"quay-cache",registry_id:2}]')
          G=$(jq -n '[{id:1,name:"dockerhub",status:"healthy"},
                      {id:2,name:"quay",status:"unhealthy"}]')
          if OUT=$(PROJECTS_JSON="$P" REGISTRIES_JSON="$G" \
                   ./chapters/ch14/cache-health.sh); then
            echo "an unhealthy upstream must fail the check"; exit 1
          fi
          echo "$OUT"
          echo "$OUT" | grep -q 'quay-cache' || exit 1
          echo "$OUT" | grep -q 'platform' && {
            echo "an ordinary project is not a proxy cache"; exit 1; }

          G2=$(jq -n '[{id:1,name:"dockerhub",status:"healthy"},
                       {id:2,name:"quay",status:"healthy"}]')
          PROJECTS_JSON="$P" REGISTRIES_JSON="$G2" \
            ./chapters/ch14/cache-health.sh >/dev/null \
            || { echo "all healthy should pass"; exit 1; }
          echo "detected and not over-detected"
      - name: the library/ rewrite rule is the slash
        run: |
          for n in alpine nginx; do
            case "$n" in */*) echo "unexpected"; exit 1 ;;
              *) echo "$n -> library/$n" ;; esac
          done
          for n in bitnami/nginx library/alpine; do
            case "$n" in */*) echo "$n -> taken literally" ;;
              *) echo "unexpected"; exit 1 ;; esac
          done

  ch16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the shell really does eat the robot name
        # Chapter 16 prints exactly this. Measure it rather than
        # asserting it, and pin the two failure shapes apart.
        run: |
          unset platform
          A=$(eval 'echo "robot$platform+cluster-pull"')
          test "$A" = "robot+cluster-pull" || { echo "got $A"; exit 1; }
          platform=XYZ
          B=$(eval 'echo "robot$platform+cluster-pull"')
          test "$B" = "robotXYZ+cluster-pull" || { echo "got $B"; exit 1; }
          C=$(eval "echo 'robot\$platform+cluster-pull'")
          test "$C" = 'robot$platform+cluster-pull' || { echo "got $C"; exit 1; }
          echo "unset -> $A"
          echo "set   -> $B"
          echo "quoted-> $C"
      - name: find-pull-secrets counts only Harbor secrets
        run: |
          DOC=$(printf '{"auths":{"harbor.meridian.test":{"username":"r"}}}' \
                | base64 -w0)
          OTHER=$(printf '{"auths":{"registry.example.com":{"username":"x"}}}' \
                | base64 -w0)
          FIX=$(jq -n --arg a "$DOC" --arg b "$OTHER" '{items:[
            {metadata:{namespace:"apps",name:"harbor"},
             data:{".dockerconfigjson":$a}},
            {metadata:{namespace:"apps2",name:"harbor"},
             data:{".dockerconfigjson":$a}},
            {metadata:{namespace:"other",name:"elsewhere"},
             data:{".dockerconfigjson":$b}}]}')
          OUT=$(SECRETS_JSON="$FIX" ./chapters/ch16/find-pull-secrets.sh)
          echo "$OUT"
          echo "$OUT" | grep -q '2 namespace(s)' || exit 1
          echo "$OUT" | grep -q 'other' && {
            echo "a non-Harbor secret was counted"; exit 1; }
          echo "counted correctly"

  ch17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the lab values are honestly not HA-ready
        # The chapter's claim, checked against this repo's own values:
        # bundled database, bundled redis, filesystem storage. If any of
        # those ever changes, this turns red and the chapter needs a
        # second look.
        run: |
          if ./chapters/ch17/ha-readiness.sh k8s/values-harbor.yaml; then
            echo "the lab values claim HA readiness - they should not"
            exit 1
          fi
          OUT=$(./chapters/ch17/ha-readiness.sh k8s/values-harbor.yaml || true)
          echo "$OUT"
          for want in "external database" "external redis" "object storage"; do
            echo "$OUT" | grep -q "NO   $want" \
              || { echo "expected $want to be flagged"; exit 1; }
          done
      - name: external state passes
        run: |
          cat > /tmp/ha.yaml <<'YAML'
          database:
            type: external
          redis:
            type: external
          persistence:
            imageChartStorage:
              type: s3
          YAML
          sed -i 's/^          //' /tmp/ha.yaml
          ./chapters/ch17/ha-readiness.sh /tmp/ha.yaml \
            || { echo "external state should pass"; exit 1; }

  ch18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the key mapping is complete and the lengths are enforced
        run: |
          OUT=$(./chapters/ch18/secret-keys.sh)
          echo "$OUT"
          for k in HARBOR_ADMIN_PASSWORD secretKey secret CSRF_KEY \
                   JOBSERVICE_SECRET REGISTRY_HTTP_SECRET password; do
            echo "$OUT" | grep -q "$k" || { echo "$k missing"; exit 1; }
          done
      - name: a wrong length fails, a correct one passes
        # The first version of this script set a flag inside a while
        # loop on the right of a pipe. That runs in a subshell, so the
        # flag was lost and the script exited 0 whatever it found - a
        # check that cannot fail. Assert that it can.
        run: |
          G=$(printf '%s' "$(openssl rand -hex 8)" | base64 -w0)
          B=$(printf '%s' short | base64 -w0)
          BAD=$(jq -n --arg g "$G" --arg b "$B" \
                '{data:{"secretKey":$g,"secret":$b}}')
          if SECRET_JSON="$BAD" ./chapters/ch18/secret-keys.sh \
               check dummy >/dev/null; then
            echo "a 5-character core secret must fail"; exit 1
          fi
          OK=$(jq -n --arg g "$G" '{data:{"secretKey":$g,"secret":$g}}')
          SECRET_JSON="$OK" ./chapters/ch18/secret-keys.sh \
            check dummy >/dev/null \
            || { echo "correct lengths must pass"; exit 1; }
          echo "the check can fail, and does not fail wrongly"

  ch19:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the built dockerconfig carries auth, and it matches
        run: |
          OUT=$(./chapters/ch19/dockerconfig.sh build \
                'robot$platform+cluster-pull' 'sYb3cret')
          echo "$OUT" | jq -e '.auths["harbor.meridian.test"].auth' >/dev/null
          DEC=$(echo "$OUT" \
            | jq -r '.auths["harbor.meridian.test"].auth' | base64 -d)
          test "$DEC" = 'robot$platform+cluster-pull:sYb3cret' \
            || { echo "auth is not user:pass, got $DEC"; exit 1; }
          echo "auth = $DEC"
          echo "$OUT" | jq -e '.auths["harbor.meridian.test"].username
            | contains("$")' >/dev/null \
            || { echo "the dollar did not survive"; exit 1; }
      - name: a missing auth field fails the check
        # containerd reads auth; Docker's client does not. Emit only
        # username/password and a laptop keeps working while the cluster
        # stops - so the check has to catch it.
        run: |
          OUT=$(./chapters/ch19/dockerconfig.sh build \
                'robot$platform+cluster-pull' 'sYb3cret')
          if DOCKERCONFIG_JSON="$OUT" \
             ./chapters/ch19/dockerconfig.sh check dummy >/dev/null; then
            echo "a correct config must pass"
          else
            echo "a correct config failed"; exit 1
          fi
          NOAUTH=$(printf '%s' "$OUT" | jq 'del(.auths[].auth)')
          if DOCKERCONFIG_JSON="$NOAUTH" \
             ./chapters/ch19/dockerconfig.sh check dummy >/dev/null; then
            echo "a config with no auth must fail"; exit 1
          fi
          BADAUTH=$(printf '%s' "$OUT" \
            | jq '.auths[].auth = "bm90LXJpZ2h0"')
          if DOCKERCONFIG_JSON="$BADAUTH" \
             ./chapters/ch19/dockerconfig.sh check dummy >/dev/null; then
            echo "a mismatched auth must fail"; exit 1
          fi
          echo "missing and mismatched auth both caught"

  compose-labs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pin: [pinned, latest]
    continue-on-error: ${{ matrix.pin == 'latest' }}
    steps:
      - uses: actions/checkout@v5
      - name: resolve the version under test
        id: v
        run: |
          eval "$(grep -E '^[A-Z_]+=' VERSIONS.md)"
          if [ "${{ matrix.pin }}" = latest ]; then
            V=$(curl -s \
              https://api.github.com/repos/goharbor/harbor/releases/latest \
              | jq -r .tag_name)
          else
            V="$HARBOR_VERSION"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "testing Harbor $V"
      - name: placeholder
        run: |
          echo "Chapter 3 fills this in: fetch the offline installer for"
          echo "${{ steps.v.outputs.version }}, verify its sigstore bundle,"
          echo "render harbor.yml, run install.sh, wait for health."

  k8s-labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the chart version Helm wants carries no v
        # Chart.yaml reads version 1.19.2, appVersion 2.15.2. The v in
        # VERSIONS.md is the Git tag convention and 'helm --version
        # v1.19.2' finds nothing.
        run: |
          . ./scripts/versions.sh
          case "$HARBOR_CHART_VERSION" in
            v*) echo "VERSIONS.md carries the tag form, as intended" ;;
            *)  echo "expected the tag form in VERSIONS.md"; exit 1 ;;
          esac
          STRIPPED="${HARBOR_CHART_VERSION#v}"
          case "$STRIPPED" in
            v*) echo "the v was not stripped"; exit 1 ;;
            *)  echo "helm form: $STRIPPED" ;;
          esac
          grep -q 'HARBOR_CHART_VERSION#v' ./chapters/ch15/install-chart.sh \
            || { echo "install-chart.sh must strip the v"; exit 1; }
      - name: the chart values this repo overrides are the risky defaults
        run: |
          for k in certSource secretKey; do
            grep -q "$k" ./chapters/ch15/install-chart.sh \
              || { echo "$k is not addressed"; exit 1; }
          done
          grep -qE 'size: *[0-9]+Gi' ./k8s/values-harbor.yaml \
            || { echo "the registry volume size must be set"; exit 1; }
          echo "certSource, secretKey and the volume size are all set"
      - name: node-trust refuses an unknown distribution
        run: |
          if ./chapters/ch15/node-trust.sh nonsense 2>/dev/null; then
            echo "expected a refusal"; exit 1
          fi
          echo "refused, as it must"

  ch20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: openbao is the same provider, and the mount is not in the URI
        # sigstore's hashivault provider matches
        # ^(?:hashivault|openbao)://<name>$ - the part after the scheme
        # is a key name and may not contain a slash. Both claims are in
        # the chapter, so both are asserted here.
        run: |
          for R in hashivault://harbor-signing openbao://harbor-signing; do
            ./chapters/ch20/vault-signing.sh ref "$R" >/dev/null \
              || { echo "$R must be accepted"; exit 1; }
          done
          echo "both schemes accepted"
          if ./chapters/ch20/vault-signing.sh ref \
               hashivault://transit/harbor-signing >/dev/null 2>&1; then
            echo "a mount in the reference must be refused"; exit 1
          fi
          if ./chapters/ch20/vault-signing.sh ref \
               vault://harbor-signing >/dev/null 2>&1; then
            echo "vault:// is not the scheme cosign takes"; exit 1
          fi
          echo "a path and the wrong scheme are both refused"
      - name: the mount comes from the environment, default transit
        run: |
          ./chapters/ch20/vault-signing.sh ref hashivault://harbor-signing \
            | grep -q 'transit/sign/harbor-signing' \
            || { echo "the default mount must be transit"; exit 1; }
          TRANSIT_SECRET_ENGINE_PATH=pki-signing \
            ./chapters/ch20/vault-signing.sh ref hashivault://harbor-signing \
            | grep -q 'pki-signing/sign/harbor-signing' \
            || { echo "the mount override is ignored"; exit 1; }
          echo "default and override both resolve"
      - name: a missing address fails, a missing token does not
        # cosign falls back to a token helper before giving up, so an
        # unset token is not by itself an error. An unset address is.
        run: |
          if env -u VAULT_ADDR -u BAO_ADDR \
                 ./chapters/ch20/vault-signing.sh env >/dev/null 2>&1; then
            echo "no address must fail"; exit 1
          fi
          BAO_ADDR=http://127.0.0.1:8200 \
            env -u VAULT_TOKEN -u BAO_TOKEN \
            ./chapters/ch20/vault-signing.sh env >/dev/null \
            || { echo "BAO_ADDR alone must be enough"; exit 1; }
          echo "address required, token optional - as cosign has it"
      - name: the signature carries the key version
        run: |
          V=$(./chapters/ch20/vault-signing.sh version 'vault:v2:MEUCIQD')
          test "$V" = "key version 2" \
            || { echo "expected version 2, got: $V"; exit 1; }
          if ./chapters/ch20/vault-signing.sh version 'MEUCIQD' \
               >/dev/null 2>&1; then
            echo "an unprefixed signature is not from transit"; exit 1
          fi
          echo "$V, and an unprefixed signature is rejected"
      - name: the policy grants signing without export
        run: |
          P=chapters/ch20/signing-policy.hcl
          grep -q 'transit/sign/harbor-signing' "$P" \
            || { echo "no signing path"; exit 1; }
          grep -qE 'transit/export' "$P" \
            || { echo "export must be addressed"; exit 1; }
          grep -q 'capabilities = \["update"\]' "$P" \
            || { echo "signing needs update"; exit 1; }
          echo "sign yes, export no"

  ch21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: helm
        run: |
          command -v helm >/dev/null || {
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; }
          helm version --short
          helm repo add harbor https://helm.goharbor.io >/dev/null
      - name: the chapter's claims about the chart still hold
        # Every one of these is printed in Chapter 21. If the chart
        # changes, this job is how the book finds out.
        run: |
          . ./scripts/versions.sh
          V="${HARBOR_CHART_VERSION#v}"
          T() { helm template harbor harbor/harbor --version "$V" "$@"; }
          # the file logger renders a claim; the database logger does not
          T -s templates/jobservice/jobservice-dpl.yaml \
            | grep -A1 '^      - name: job-logs' | grep -q persistentVolumeClaim \
            || { echo "the default job logger must use a PVC"; exit 1; }
          T --set 'jobservice.jobLoggers[0]=database' \
            -s templates/jobservice/jobservice-dpl.yaml \
            | grep -A1 '^      - name: job-logs' | grep -q emptyDir \
            || { echo "the database logger must drop the PVC"; exit 1; }
          echo "jobLoggers: file -> PVC, database -> emptyDir"
      - name: the documented value names do nothing
        # The website HA doc says jobservice.jobLogger and omits the
        # jobLog level. Helm accepts both without a word.
        run: |
          . ./scripts/versions.sh
          V="${HARBOR_CHART_VERSION#v}"
          T() { helm template harbor harbor/harbor --version "$V" "$@"; }
          T --set jobservice.jobLogger=database \
            -s templates/jobservice/jobservice-dpl.yaml \
            | grep -A1 '^      - name: job-logs' | grep -q persistentVolumeClaim \
            || { echo "the singular spelling appears to work now"; exit 1; }
          P=persistence.persistentVolumeClaim.jobservice
          T --set "$P.accessMode=ReadWriteMany" \
            -s templates/jobservice/jobservice-pvc.yaml \
            | grep -q ReadWriteOnce \
            || { echo "the documented path appears to work now"; exit 1; }
          T --set "$P.jobLog.accessMode=ReadWriteMany" \
            -s templates/jobservice/jobservice-pvc.yaml \
            | grep -q ReadWriteMany \
            || { echo "the real path stopped working"; exit 1; }
          echo "both documented paths are still ignored, as the book says"
      - name: two emptyDirs that mean opposite things
        run: |
          . ./scripts/versions.sh
          V="${HARBOR_CHART_VERSION#v}"
          T() { helm template harbor harbor/harbor --version "$V" "$@"; }
          A=$(T --set persistence.imageChartStorage.type=s3 \
                -s templates/registry/registry-dpl.yaml \
              | grep -A1 '^      - name: registry-data')
          B=$(T --set persistence.enabled=false \
                -s templates/registry/registry-dpl.yaml \
              | grep -A1 '^      - name: registry-data')
          test "$A" = "$B" \
            || { echo "the two renders differ; the book says they do not"; exit 1; }
          echo "$A" | grep -q emptyDir || { echo "expected emptyDir"; exit 1; }
          echo "identical renders, opposite meanings"
      - name: the numbers the sizing rests on
        run: |
          . ./scripts/versions.sh
          V="${HARBOR_CHART_VERSION#v}"
          T() { helm template harbor harbor/harbor --version "$V" "$@"; }
          T --set metrics.enabled=true \
            | grep -qE 'POSTGRESQL_MAX_OPEN_CONNS: "900"' \
            || { echo "maxOpenConns is no longer 900"; exit 1; }
          T --set metrics.enabled=true \
            | grep -qE 'HARBOR_DATABASE_MAX_OPEN_CONNS: "900"' \
            || { echo "the exporter no longer shares the value"; exit 1; }
          T -s templates/trivy/trivy-sts.yaml | grep -q 'kind: StatefulSet' \
            || { echo "trivy is no longer a StatefulSet"; exit 1; }
          T -s templates/trivy/trivy-sts.yaml | grep -q volumeClaimTemplates \
            || { echo "trivy no longer has a claim template"; exit 1; }
          echo "900 per pod, both names; trivy is a StatefulSet with a claim template"
      - name: render-check passes a good release and fails a bad one
        run: |
          . ./scripts/versions.sh
          V="${HARBOR_CHART_VERSION#v}"
          helm template harbor harbor/harbor --version "$V" \
            -f k8s/values-ha.yaml > /tmp/good.yaml
          MAX_CONNS=1024 ./chapters/ch21/render-check.sh /tmp/good.yaml \
            || { echo "the book's own HA values must pass"; exit 1; }
          helm template harbor harbor/harbor --version "$V" \
            --set registry.replicas=3 --set jobservice.replicas=3 \
            --set core.replicas=3 > /tmp/bad.yaml
          if ./chapters/ch21/render-check.sh /tmp/bad.yaml; then
            echo "replicas without shared storage must fail"; exit 1
          fi
          helm template harbor harbor/harbor --version "$V" \
            --set persistence.enabled=false > /tmp/ephemeral.yaml
          if ./chapters/ch21/render-check.sh /tmp/ephemeral.yaml; then
            echo "an ephemeral registry must fail"; exit 1
          fi
          echo "good passes, both bad releases fail"

  ch22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build three backup fixtures
        # No Harbor needed: verify reads a backup directory and a
        # manifest, which is the point of it being offline.
        run: |
          mk() {
            D=$1; DE=$2; BS=$3; KEY=$4
            mkdir -p "$D"
            echo dump > "$D/database.sql"
            echo cfg  > "$D/harbor.yml"
            mkdir -p "$D/t/registry" && echo b > "$D/t/registry/blob"
            tar -C "$D/t" -cf "$D/registry.tar" registry
            mkdir -p "$D/s/secret/keys" "$D/s/secret/core"
            echo c > "$D/s/secret/core/private_key.pem"
            [ "$KEY" = yes ] && echo k > "$D/s/secret/keys/secretkey"
            tar -C "$D/s" -cf "$D/secret.tar" secret
            rm -rf "$D/t" "$D/s"
            jq -n --arg de "$DE" --arg bs "$BS" \
              '{database:{file:"database.sql",started_at:$de,finished_at:$de},
                blobs:{file:"registry.tar",started_at:$bs,finished_at:$bs},
                secrets:{file:"secret.tar"}}' > "$D/manifest.json"
          }
          mk /tmp/good  2026-08-19T10:00:00Z 2026-08-19T10:05:00Z yes
          mk /tmp/wrong 2026-08-19T10:05:00Z 2026-08-19T10:00:00Z yes
          mk /tmp/nokey 2026-08-19T10:00:00Z 2026-08-19T10:05:00Z no
      - name: a complete backup in the right order verifies
        run: |
          ./chapters/ch22/backup.sh verify /tmp/good
      - name: the wrong order is caught
        # Blobs older than the database is the failure this whole
        # chapter exists to prevent, and it is invisible until a pull.
        run: |
          if ./chapters/ch22/backup.sh verify /tmp/wrong; then
            echo "blobs before the database must fail"; exit 1
          fi
          ./chapters/ch22/backup.sh verify /tmp/wrong 2>&1 \
            | grep -q 'order:' || { echo "no ordering message"; exit 1; }
          echo "caught, with a message that names the order"
      - name: a missing secret key is caught
        # Harbor starts without it. Replication, proxy cache, LDAP bind
        # and OIDC credentials never decrypt again.
        run: |
          if ./chapters/ch22/backup.sh verify /tmp/nokey; then
            echo "a backup without the AES key must fail"; exit 1
          fi
          ./chapters/ch22/backup.sh verify /tmp/nokey 2>&1 \
            | grep -q 'secretkey missing' \
            || { echo "the message must name the key"; exit 1; }
          echo "caught"
      - name: run refuses the wrong order without an explicit override
        run: |
          if ./chapters/ch22/backup.sh run /tmp/out --order blobs-first; then
            echo "blobs-first must be refused"; exit 1
          fi
          echo "refused"
      - name: restore refuses a backup that does not verify
        run: |
          if ./chapters/ch22/restore.sh /tmp/wrong; then
            echo "restore must refuse an unverifiable backup"; exit 1
          fi
          echo "refused"
      - name: the plan names garbage collection
        # read_only does not stop GC - job callbacks are on the
        # middleware's skip list. If the plan stops saying so, the
        # chapter's central warning has gone missing.
        run: |
          ./chapters/ch22/backup.sh plan | grep -qi 'garbage collection' \
            || { echo "the plan must mention GC"; exit 1; }
          ./chapters/ch22/backup.sh plan | grep -q 'secret/keys/secretkey\|/data/secret' \
            || { echo "the plan must mention the secret directory"; exit 1; }
          echo "plan still names both"

  ch23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: helm
        run: |
          command -v helm >/dev/null || {
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; }
          helm repo add harbor https://helm.goharbor.io >/dev/null
      - name: forward only - there are still no down migrations
        # The whole rollback story rests on this. If a down migration
        # ever appears, the chapter is wrong and this job says so.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./chapters/ch23/upgrade-check.sh migrations
          ./chapters/ch23/upgrade-check.sh migrations | grep -q 'down migrations: 0' \
            || { echo "down migrations exist; rewrite Chapter 23"; exit 1; }
      - name: a patch upgrade carries no schema change, but check anyway
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/versions.sh
          FROM=180 ./chapters/ch23/upgrade-check.sh pending "$HARBOR_VERSION" \
            | grep -q 'No change in schema' \
            || { echo "v2.15.x gained a migration above 0180"; exit 1; }
          # 0171_2.14.1 is the counter-example the chapter prints: a
          # patch release that did carry one.
          FROM=170 ./chapters/ch23/upgrade-check.sh pending "$HARBOR_VERSION" \
            | grep -q '0171_2.14.1' \
            || { echo "the patch-with-a-migration example is gone"; exit 1; }
          echo "no schema change for the pinned patch; 2.14.1 still proves the exception"
      - name: helm upgrade regenerates certificates and not secretKey
        # Two identical renders. What differs is what an upgrade
        # replaces in the cluster.
        run: |
          OUT=$(./chapters/ch23/upgrade-check.sh certs)
          echo "$OUT"
          echo "$OUT" | grep -qE '^tls.crt +REPLACED' \
            || { echo "certificates no longer regenerate"; exit 1; }
          echo "$OUT" | grep -qE '^secretKey +same' \
            || { echo "secretKey no longer comes from values"; exit 1; }
      - name: the rollback text says restore, not downgrade
        run: |
          OUT=$(./chapters/ch23/upgrade-check.sh rollback)
          echo "$OUT" | grep -qi 'does not support downgrades' \
            || { echo "the rollback text must say so"; exit 1; }
          echo "$OUT" | grep -qi 'restore' \
            || { echo "the rollback text must point at Chapter 22"; exit 1; }
          echo "ok"

  ch24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: helm
        run: |
          command -v helm >/dev/null || {
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash; }
          helm repo add harbor https://helm.goharbor.io >/dev/null
      - name: ten webhook events, and the nine topics without one
        # Computed from Harbor's source at the pinned tag. If Harbor adds
        # a webhook for DELETE_PROJECT, this fails and the chapter gets
        # rewritten instead of quietly going stale.
        run: |
          OUT=$(./chapters/ch24/observe.sh events)
          echo "$OUT"
          echo "$OUT" | grep -q 'webhook events:  10' \
            || { echo "the webhook event count changed"; exit 1; }
          for E in DELETE_PROJECT DELETE_REPOSITORY DELETE_TAG DELETE_ROBOT \
                   CREATE_PROJECT CREATE_ROBOT CREATE_TAG \
                   ARTIFACT_LABELED COMMON_API; do
            echo "$OUT" | sed -n '/audit log only/,$p' | grep -qw "$E" \
              || { echo "$E is no longer webhook-less"; exit 1; }
          done
          for E in PUSH_ARTIFACT PULL_ARTIFACT DELETE_ARTIFACT REPLICATION \
                   TAG_RETENTION QUOTA_EXCEED QUOTA_WARNING \
                   SCANNING_FAILED SCANNING_STOPPED SCANNING_COMPLETED; do
            echo "$OUT" | sed -n '1,/audit log only/p' | grep -qw "$E" \
              || { echo "$E lost its webhook"; exit 1; }
          done
          echo "10 hooked, 9 not, exactly as the chapter prints"
      - name: four metrics endpoints on 8001, off by default
        run: |
          OUT=$(./chapters/ch24/observe.sh endpoints)
          echo "$OUT"
          echo "$OUT" | grep -q 'METRIC_PORT: "8001"' \
            || { echo "the metrics port changed"; exit 1; }
          for S in core jobservice exporter; do
            echo "$OUT" | grep -q "SUBSYSTEM: $S" \
              || { echo "$S no longer exposes metrics"; exit 1; }
          done
          helm template harbor harbor/harbor \
            --version "$(. ./scripts/versions.sh; echo "${HARBOR_CHART_VERSION#v}")" \
            | grep -q 'METRIC_ENABLE' \
            && { echo "metrics must be off by default"; exit 1; }
          echo "four endpoints on 8001, and off unless asked for"
      - name: the receiver answers inside the three-second budget
        # Harbor allows 3s and 3 attempts. A receiver that works before
        # it responds gets dropped, so the shape is what is tested here.
        run: |
          ./chapters/ch24/webhook-listen.sh 9877 >/tmp/wh.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS -o /dev/null localhost:9877 -d '{}' 2>/dev/null && break
            sleep 0.5
          done
          START=$(date +%s%N)
          curl -fsS -o /dev/null -X POST localhost:9877 \
            -H 'Content-Type: application/json' \
            -d '{"type":"harbor.artifact.pushed","operator":"alice"}'
          END=$(date +%s%N)
          MS=$(( (END - START) / 1000000 ))
          echo "acknowledged in ${MS}ms, budget is 3000ms"
          test "$MS" -lt 3000 || { echo "too slow for Harbor"; exit 1; }
          grep -q 'harbor.artifact.pushed' /tmp/wh.log \
            || { echo "the payload was not printed"; exit 1; }
          kill %1 2>/dev/null || true
      - name: the handover has all eight questions and runs without Harbor
        run: |
          HARBOR_PASS=x HARBOR_URL=http://127.0.0.1:1 \
            ./chapters/ch24/handover.sh > /tmp/HANDOVER.md
          N=$(grep -c '^## ' /tmp/HANDOVER.md)
          test "$N" = 8 || { echo "expected 8 sections, got $N"; exit 1; }
          grep -q 'Last verified restore' /tmp/HANDOVER.md \
            || { echo "the restore date must be asked for"; exit 1; }
          grep -q 'frozen once users exist' /tmp/HANDOVER.md \
            || { echo "auth_mode must carry its warning"; exit 1; }
          echo "eight questions, and it degrades to blanks without Harbor"
