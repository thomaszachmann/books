# Chapter 17 - Agent Injector.
#
# The annotations must be on the POD TEMPLATE, not on the Deployment's own
# metadata. On the Deployment they do nothing, silently, and the pod comes
# up with one container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracking
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels: { app: tracking }
  template:
    metadata:
      labels: { app: tracking }
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "tracking"
        vault.hashicorp.com/agent-inject-secret-db: "secret/data/tracking"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/data/tracking" -}}
          DB_USER={{ .Data.data.db_user }}
          DB_PASS={{ .Data.data.db_password }}
          {{- end }}
    spec:
      serviceAccountName: tracking
      containers:
        - name: app
          image: alpine
          command: ["sh", "-c", "sleep 3600"]
