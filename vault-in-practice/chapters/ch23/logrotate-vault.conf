# Chapter 23 - rotate the audit log. Vault does not do this itself, and
# a full disk is the most common cause of the fail-closed outage.
#
# copytruncate is the directive that matters. Vault writes to the file
# DESCRIPTOR, not the path. Without it, logrotate renames the file, Vault
# carries on writing to the renamed inode, and the new audit.log stays
# empty forever - auditing appears to work and produces nothing.

/vault/logs/audit.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
