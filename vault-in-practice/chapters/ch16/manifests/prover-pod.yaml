# Chapter 16 - a pod that authenticates with nothing delivered to it.
#
# The only credential involved is the ServiceAccount token the kubelet
# mounts. Vault asks Kubernetes whether it is genuine.
apiVersion: v1
kind: Pod
metadata:
  name: prover
  namespace: production
spec:
  serviceAccountName: tracking
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl
      command: ["sh", "-c", "sleep 3600"]
