# Vault in Practice - the lab environment.
#
# Chapter 2  starts vault
# Chapter 10 adds postgres
# Chapter 18 adds openbao
#
#   docker compose up -d vault
#   docker compose up -d postgres
#   docker compose up -d openbao

services:
  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config:/vault/config:ro
      - ./data:/vault/data
      - ./logs:/vault/logs
      - ./tls:/vault/tls:ro
    command: vault server -config=/vault/config/vault.hcl
    restart: unless-stopped

  # Chapter 10 - dynamic database credentials
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-root
      POSTGRES_DB: meridian
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  # Chapter 18 - OpenBao side by side with Vault
  openbao:
    image: openbao/openbao:2.6.2
    container_name: openbao
    ports:
      - "127.0.0.1:8300:8200"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: bao server -dev
    restart: unless-stopped

  # Chapter 19 - a server that trusts the Vault SSH CA.
  # ONE line of configuration: TrustedUserCAKeys. No key is ever copied
  # here, and none has to be removed when somebody leaves.
  sshd:
    image: alpine:3.20
    container_name: sshd
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ./chapters/ch19/ssh-ca:/etc/ssh/ca:ro
    command: >
      sh -c "apk add --no-cache openssh >/dev/null &&
             ssh-keygen -A &&
             adduser -D ubuntu &&
             passwd -u ubuntu &&
             echo 'TrustedUserCAKeys /etc/ssh/ca/trusted-ca.pem'
               >> /etc/ssh/sshd_config &&
             echo 'PubkeyAuthentication yes'
               >> /etc/ssh/sshd_config &&
             echo 'LogLevel VERBOSE' >> /etc/ssh/sshd_config &&
             /usr/sbin/sshd -D -e"
    restart: unless-stopped
