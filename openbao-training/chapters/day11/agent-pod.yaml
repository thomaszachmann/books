apiVersion: v1
kind: Pod
metadata:
  name: webshop-agent
  namespace: webshop
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "webshop"
    vault.hashicorp.com/tls-secret: "openbao-ca"
    vault.hashicorp.com/ca-cert: "/vault/tls/ca.crt"
    vault.hashicorp.com/agent-service-account-token-volume-name: "bao-token"
    vault.hashicorp.com/agent-inject-secret-db.env: "secret/data/webshop/config"
    vault.hashicorp.com/agent-inject-template-db.env: |
      {{- with secret "secret/data/webshop/config" -}}
      DB_USER={{ .Data.data.db_user }}
      DB_PASS={{ .Data.data.db_pass }}
      {{- end }}
spec:
  serviceAccountName: webshop
  volumes:
    - name: bao-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: openbao
              expirationSeconds: 3600
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do cat /vault/secrets/db.env; sleep 30; done"]
