# kind cluster for Chapter 15.
#
# The extraPortMappings are the whole point. kind has no load balancer,
# so the ingress controller has to be reachable on the host's own ports
# or 'docker push' from your laptop cannot get in. minikube solves the
# same problem a completely different way, with 'minikube tunnel'.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: harbor-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
