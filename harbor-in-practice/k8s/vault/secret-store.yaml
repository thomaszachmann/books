# Chapter 18 step 3 and Chapter 19 step 3. One store for the harbor
# namespace, one for the whole cluster; both read the token from the
# vault-token secret in harbor (kubectl -n harbor create secret generic
# vault-token --from-literal=token=root).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: harbor
spec:
  provider:
    vault:
      server: http://vault.vault:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: vault-token
          key: token
          namespace: harbor
